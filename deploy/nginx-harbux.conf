# Ganti GANTI_DOMAIN dengan domain kamu, lalu simpan sebagai
#   /etc/nginx/sites-available/harbux
# dan aktifkan dengan:
#   ln -s /etc/nginx/sites-available/harbux /etc/nginx/sites-enabled/
# Blok HTTPS (sertifikat) ditambahkan otomatis oleh certbot.
#
# Baris berikut harus ditambahkan di dalam blok http { } pada
# /etc/nginx/nginx.conf, karena limit_req_zone tidak boleh di dalam server { }:
#   limit_req_zone $binary_remote_addr zone=harbux_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name GANTI_DOMAIN;

    # ukuran maksimal kiriman data
    client_max_body_size 2m;

    # Batasi percobaan login dari satu IP (pelengkap pembatasan di aplikasi)
    location = /auth/login {
        limit_req zone=harbux_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    # Cek kesehatan server API
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        access_log off;
    }

    # Semua halaman & permintaan lain ditangani Next.js,
    # yang meneruskan /api/* dan /auth/* ke API di port 8080.
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
