# Nginx untuk Harbux — susunan: web di Vercel, API di server ini.
#
# Ganti GANTI_DOMAIN_API dengan subdomain API kamu (mis. api.harbux.com),
# lalu simpan sebagai /etc/nginx/sites-available/harbux dan aktifkan:
#   ln -s /etc/nginx/sites-available/harbux /etc/nginx/sites-enabled/
# Blok HTTPS (sertifikat) ditambahkan otomatis oleh certbot.
#
# Baris berikut harus ditambahkan di dalam blok http { } pada
# /etc/nginx/nginx.conf, karena limit_req_zone tidak boleh di dalam server { }:
#   limit_req_zone $binary_remote_addr zone=harbux_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name GANTI_DOMAIN_API;

    # ukuran maksimal kiriman data
    client_max_body_size 2m;

    # Batasi percobaan login dari satu IP (pelengkap pembatasan di aplikasi)
    location = /auth/login {
        limit_req zone=harbux_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    # Cek kesehatan server API
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        access_log off;
    }

    # Hanya dua awalan ini yang dilayani API. Selain itu ditolak, supaya
    # permukaan yang terbuka ke internet sesempit mungkin.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    location / {
        return 404;
    }
}
